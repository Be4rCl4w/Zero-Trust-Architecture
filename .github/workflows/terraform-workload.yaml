name: Terraform Workload

on:
  push:
    branches: [ "main" ]
    paths:
      - 'terraform/workload/**'

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

defaults:
  run:
    working-directory: terraform/workload

jobs:
 apply:
    runs-on: self-hosted
    environment: production   # approval gate + environment federated credential
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.6

      - name: Terraform Init
        run: terraform init

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }} 
    
      - name: Terraform Plan
        env:
          TF_VAR_vmss_public_key: ${{ vars.VMSS_PUBLIC_KEY }}
          TF_VAR_object_id: ${{ secrets.ADMIN_OBJECT_ID }}
        run: terraform plan -input=false -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan

      - name: Terraform Apply
        env:
          TF_VAR_vmss_public_key: ${{ vars.VMSS_PUBLIC_KEY }}
          TF_VAR_object_id: ${{ secrets.ADMIN_OBJECT_ID }}
        run: terraform apply -input=false -auto-approve "tfplan"