name: Terraform Policy

on:
  push:
    branches: [ "main" ]
    paths:
      - 'terraform/policies/**'

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

defaults:
  run:
    working-directory: terraform/policies

jobs:
  policy:
    runs-on: self-hosted
    environment: production   # approval gate + environment federated credential
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.6

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init 

      - name: Terraform Plan
        run: terraform plan -input=false -out=trfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: trfplan
          path: trfplan

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve "trfplan"